[project]
name = "cooking-compass"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanjay", email = "sanjay.05@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-jose>=3.5.0",
    "asyncmy>=0.2.14",
    "cryptography>=50.0.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.1",
    "redis>=8.1.0",
    "greenlet>=3.5.5",
    "certifi>=2026.7.22",
]

[project.scripts]
cooking-compass = "cooking_compass:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
